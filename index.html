<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Main page</title>

    <link rel="icon" type="image/png"
          href="{{ url_for('static', filename='favicon.png') }}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
            box-sizing: border-box;
        }

        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;

            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;

            font-weight: bold;
        }

        .bottom-bar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom-bar a:hover {
            text-decoration: underline;
        }
        
        .copyright {
            position: absolute;
            right: 20px;
            bottom: 10px;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <p>hello</p>
</body>
</html>
